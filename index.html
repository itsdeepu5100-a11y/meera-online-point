<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meera Online Point | Hardoi's Trusted Digital Service Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="dynamic-bg">
        <div class="logo-area">
            <h2>Meera Online Point</h2>
            <p>Fast • Trusted • Secure</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="dynamic-text">
        <section class="services-section">
            <h2>Our Popular Services</h2>
            <!-- यहाँ सर्विसेज डेटाबेस से लोड होकर अपने आप दिखेंगी -->
            <div id="services-container" class="services-grid"></div>
        </section>

        <!-- Admin Controls Panel (लॉगिन के बाद सिर्फ एडमिन को दिखेगा) -->
        <section id="admin-panel" class="admin-panel-box" style="display: none;">
            <h3>🛠️ एडमिन कंट्रोल पैनल</h3>
            
            <div class="control-group">
                <label>वेबसाइट का बैकग्राउंड कलर बदलें:</label>
                <input type="color" id="bg-color-picker">
            </div>

            <div class="control-group">
                <label>अक्षरों का साइज (Font Size) बदलें:</label>
                <select id="text-size-picker">
                    <option value="14px">Small</option>
                    <option value="16px">Medium</option>
                    <option value="20px">Large</option>
                </select>
            </div>

            <div class="control-group">
                <label>नई सर्विस जोड़ें:</label>
                <input type="text" id="new-service-name" placeholder="सर्विस का नाम लिखें...">
                <button id="btn-add-service">Add Service</button>
            </div>

            <button id="btn-save-settings" class="save-btn">थीम सेटिंग्स सेव करें</button>
            <button id="btn-logout" class="logout-btn">Log Out</button>
        </section>

        <!-- Admin Login Trigger (पेज के सबसे नीचे छुपा हुआ रहेगा) -->
        <div class="admin-trigger-zone">
            <button id="btn-admin-login-trigger">Admin Login</button>
        </div>

        <!-- Login Modal Popup -->
        <div id="login-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h3>एडमिन लॉगिन</h3>
                <input type="email" id="admin-email" placeholder="Email Id">
                <input type="password" id="admin-password" placeholder="Password">
                <button id="btn-submit-login">Sign In</button>
                <button id="btn-close-modal" class="close-btn">Cancel</button>
            </div>
        </div>
    </main>

    <!-- Firebase Scripts Connection -->
    <script type="module" src="script.js"></script>
</body>
</html>
