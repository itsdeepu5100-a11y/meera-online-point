<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Meera Local business profile">
<title>Business Profile | Meera Local</title>
<style>
:root{--brand:#176b52;--dark:#10513e;--bg:#f4f7f5;--text:#17231f;--muted:#66756e;--line:#dce6e0}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--line);padding:15px 18px}.nav{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800;color:var(--dark);text-decoration:none}.back{color:var(--dark);text-decoration:none;font-size:14px}
main{max-width:900px;margin:30px auto;padding:0 15px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 8px 28px rgba(20,50,35,.05)}
#loading{text-align:center;color:var(--muted);padding:30px}#error{display:none;text-align:center}.tag{display:inline-block;background:#e8f3ed;color:var(--dark);border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700}.name{font-size:32px;font-weight:800;margin:13px 0 8px}.area{color:var(--muted);margin-bottom:22px}.desc{line-height:1.7;color:#52615b;margin-bottom:24px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:12px}.info-box{border:1px solid var(--line);border-radius:12px;padding:14px}.label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:5px}.value{font-size:14px;line-height:1.5;word-break:break-word}
.actions{display:flex;gap:10px;margin-top:24px}.btn{flex:1;text-align:center;text-decoration:none;padding:12px;border-radius:10px;font-weight:700;font-size:14px}.call{background:var(--brand);color:#fff}.wa{background:#eaf5ee;color:var(--dark)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:28px}
@media(max-width:600px){.card{padding:19px}.name{font-size:26px}.info{grid-template-columns:1fr}.actions{flex-direction:column}}
</style>
</head>
<body>
<header><nav class="nav"><a class="brand" href="index.html">MEERA LOCAL</a><a class="back" href="businesses.html">← Businesses</a></nav></header>

<main>
<section class="card">
<div id="loading">Business profile load ho raha hai...</div>

<div id="profile" hidden>
  <span id="category" class="tag"></span>
  <h1 id="name" class="name"></h1>
  <div id="area" class="area"></div>
  <div id="description" class="desc"></div>

  <div class="info">
    <div class="info-box"><div class="label">Address</div><div id="address" class="value"></div></div>
    <div class="info-box"><div class="label">Business / Vyapar</div><div id="businessType" class="value"></div></div>
  </div>

  <div id="actions" class="actions"></div>
</div>

<div id="error">
  <h2>Profile nahi mila</h2>
  <p>Ye business available nahi hai, ya abhi approved nahi hua hai.</p>
  <a class="btn call" href="businesses.html">Businesses par wapas जाएँ</a>
</div>
</section>
</main>

<footer>© <span id="year"></span> Meera Local · Local Business & Vyapar Network</footer>

<script type="module">
import { db, doc, getDoc } from "./firebase.js";

const loading=document.getElementById("loading");
const profile=document.getElementById("profile");
const errorBox=document.getElementById("error");
document.getElementById("year").textContent=new Date().getFullYear();

function text(id,value){document.getElementById(id).textContent=value||"Not provided";}
function phoneForLink(value){
  const digits=String(value||"").replace(/\D/g,"");
  if(digits.length===10)return "91"+digits;
  if(digits.length===12&&digits.startsWith("91"))return digits;
  return "";
}

async function loadProfile(){
  const id=new URLSearchParams(location.search).get("id");
  if(!id){loading.style.display="none";errorBox.style.display="block";return;}

  try{
    const snap=await getDoc(doc(db,"localBusinesses",id));
    if(!snap.exists()||snap.data().status!=="approved"){
      loading.style.display="none";errorBox.style.display="block";return;
    }

    const b=snap.data();
    text("category",b.category||"Local Business");
    text("name",b.businessName||"Business");
    text("area",b.area?`📍 ${b.area}`:"");
    text("description",b.description||"Is business ne apni details provide nahi ki hain.");
    text("address",b.address);
    text("businessType",b.category||"Local Business");

    const actions=document.getElementById("actions");
    const phone=phoneForLink(b.phone);
    const whatsapp=phoneForLink(b.whatsapp||b.phone);
    actions.innerHTML="";
    if(phone){
      const a=document.createElement("a");
      a.className="btn call";a.href="tel:+"+phone;a.textContent="📞 Call";
      actions.appendChild(a);
    }
    if(whatsapp){
      const a=document.createElement("a");
      a.className="btn wa";a.target="_blank";a.rel="noopener noreferrer";
      a.href="https://wa.me/"+whatsapp;a.textContent="WhatsApp";
      actions.appendChild(a);
    }

    loading.style.display="none";
    profile.hidden=false;
  }catch(err){
    console.error("Profile load failed:",err);
    loading.style.display="none";
    errorBox.style.display="block";
  }
}
loadProfile();
</script>
</body>
</html>
