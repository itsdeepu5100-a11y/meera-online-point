<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meera Online Point | Admin Panel</title>

<link rel="stylesheet" href="admin.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Header -->

<header class="admin-header">

<div class="logo">

<img src="logo.png" alt="Logo">

<div>

<h2>Meera Online Point</h2>

<p>Admin Dashboard</p>

</div>

</div>

<div class="admin-user">

<span>👤 Admin</span>

<button id="logoutBtn">Logout</button>

</div>

</header>

<!-- Dashboard -->

<section class="dashboard">

<h1>Dashboard</h1>

<div class="dashboard-grid">

<div class="dashboard-card">

<h2 id="totalOrders">0</h2>

<p>Total Orders</p>

</div>

<div class="dashboard-card">

<h2 id="pendingOrders">0</h2>

<p>Pending</p>

</div>

<div class="dashboard-card">

<h2 id="processingOrders">0</h2>

<p>Processing</p>

</div>

<div class="dashboard-card">

<h2 id="completedOrders">0</h2>

<p>Completed</p>

</div>

</div>

</section>

<!-- Add Order -->

<section class="order-box">

<h2>Add New Order</h2>

<form id="adminOrderForm">

<input
type="text"
id="customerName"
placeholder="Customer Name"
required>

<input
type="tel"
id="customerMobile"
placeholder="Mobile Number"
required>

<select id="customerService" required>

<option value="">Select Service</option>

<option>PAN Card</option>

<option>Aadhaar</option>

<option>Driving Licence</option>

<option>Railway Ticket</option>

<option>Passport</option>

<option>Online Form</option>

<option>Money Transfer</option>

<option>Other</option>

</select>

<select id="orderStatus">

<option>Pending</option>

<option>Processing</option>

<option>Completed</option>

</select>

<button type="submit">

Add Order

</button>

</form>

</section>
<!-- Search Order -->

<section class="search-box">

<h2>Search Order</h2>

<input
type="text"
id="searchInput"
placeholder="Search by Name / Mobile / Service">

</section>

<!-- Order List -->

<section class="order-list">

<h2>All Orders</h2>

<table>

<thead>

<tr>

<th>Order ID</th>

<th>Name</th>

<th>Mobile</th>

<th>Service</th>

<th>Status</th>

<th>Date</th>

<th>Action</th>

</tr>

</thead>

<tbody id="orderTable">

<!-- Orders will appear here -->

</tbody>

</table>

</section>

<!-- Footer -->

<footer class="admin-footer">

<p>

© 2026 Meera Online Point | Admin Panel

</p>

</footer>

<!-- JavaScript -->

<script type="module" src="admin.js"></script>

</body>

</html>
