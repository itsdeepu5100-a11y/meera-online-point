<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meera Online Point | Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #182230;
    }
    header {
      background: #173b72;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h2 { margin: 0; font-size: 21px; }
    main { max-width: 1100px; margin: auto; padding: 20px; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px #0000000d;
    }
    .login-card { max-width: 420px; margin: 50px auto; }
    h3 { margin-top: 0; }
    input, select, button {
      font: inherit;
      padding: 11px;
      border-radius: 7px;
    }
    input, select {
      width: 100%;
      border: 1px solid #ccd3df;
      background: white;
    }
    label { display: block; margin: 12px 0 6px; }
    button {
      border: 0;
      cursor: pointer;
      background: #1769d2;
      color: white;
      font-weight: bold;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .logout { background: #dc3545; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 12px;
    }
    .stat {
      background: white;
      border-radius: 10px;
      padding: 17px;
      box-shadow: 0 2px 8px #0000000b;
    }
    .stat strong { display: block; font-size: 26px; margin-top: 8px; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .full { grid-column: 1 / -1; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 750px; }
    th, td {
      padding: 11px;
      text-align: left;
      border-bottom: 1px solid #e6e9ef;
    }
    th { background: #f7f9fc; }
    td select { min-width: 125px; }
    .delete { background: #dc3545; }
    .message { margin-top: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .error { color: #b42318; }
    .success { color: #067647; }
    [hidden] { display: none !important; }
    @media (max-width: 650px) {
      main { padding: 12px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .form-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header>
    <h2>Meera Online Point — Admin</h2>
    <button id="logoutBtn" class="logout" hidden>Logout</button>
  </header>

  <main>
    <section id="loginSection" class="card login-card">
      <h3>Admin Login</h3>
      <p>Apne registered admin email aur password se login karein.</p>
      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="username" required>

        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password"
          autocomplete="current-password" required>

        <button id="loginBtn" type="submit" style="width:100%;margin-top:16px">
          Login
        </button>
      </form>
      <p id="loginMessage" class="message" role="status"></p>
    </section>

    <section id="dashboard" hidden>
      <div class="stats">
        <div class="stat">Total Orders<strong id="totalOrders">0</strong></div>
        <div class="stat">Pending<strong id="pendingOrders">0</strong></div>
        <div class="stat">Processing<strong id="processingOrders">0</strong></div>
        <div class="stat">Completed<strong id="completedOrders">0</strong></div>
      </div>

      <section class="card" style="margin-top:20px">
        <h3>Add New Order</h3>
        <form id="addOrderForm" class="form-grid">
          <div>
            <label for="customerName">Customer Name</label>
            <input id="customerName" required>
          </div>
          <div>
            <label for="customerMobile">Mobile Number</label>
            <input id="customerMobile" type="tel" required>
          </div>
          <div>
            <label for="customerService">Service</label>
            <input id="customerService" required>
          </div>
          <div>
            <label for="customerStatus">Status</label>
            <select id="customerStatus">
              <option>Pending</option>
              <option>Processing</option>
              <option>Completed</option>
            </select>
          </div>
          <div class="full">
            <button id="addOrderBtn" type="submit">Add Order</button>
          </div>
        </form>
        <p id="orderMessage" class="message" role="status"></p>
      </section>

      <section class="card">
        <h3>All Orders</h3>
        <label for="searchInput">Search by name, phone or service</label>
        <input id="searchInput" placeholder="Search orders...">
        <p id="tableMessage" class="message" role="status"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Name</th>
                <th>Mobile</th>
                <th>Service</th>
                <th>Status</th>
                <th>Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="orderTable"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="./admin.js"></script>
</body>
</html>
